include "/etc/bind/rndc.key";

controls {
	inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

acl "primary-acl" {
	172.30.55.10;
};

acl "distribution-acl" {
	172.30.55.30;
};

logging {
	channel default_log {
		file "/var/log/bind/named.log" versions 5 size 100m;
		severity info;
		print-time yes;
		print-severity yes;
		print-category yes;
	};
	channel dnssec_log {
		file "/var/log/bind/dnssec.log" versions 5 size 100m;
		severity debug 3;
		print-time yes;
		print-severity yes;
		print-category yes;
	};
	channel xfer_log {
		file "/var/log/bind/xfer.log" versions 5 size 100m;
		severity info;
		print-time yes;
		print-severity yes;
		print-category yes;
	};
	category default { default_log; };
	category general { default_log; };
	category notify { default_log; };
	category dnssec { dnssec_log; };
	category xfer-in { xfer_log; };
	category xfer-out { xfer_log; };
};

# Shared key/lifetime settings; differ only in NSEC / NSEC3 / opt-out.
dnssec-policy "repro-nsec" {
	keys {
		ksk key-directory lifetime unlimited algorithm ecdsa256;
		zsk key-directory lifetime unlimited algorithm ecdsa256;
	};
	dnskey-ttl 300;
	publish-safety 300;
	retire-safety 300;
	purge-keys 1h;
	signatures-validity 12h;
	signatures-validity-dnskey 12h;
	signatures-refresh 2h;
	signatures-jitter 1h;
	max-zone-ttl 1d;
	# No nsec3param → NSEC
};

dnssec-policy "repro-nsec3" {
	keys {
		ksk key-directory lifetime unlimited algorithm ecdsa256;
		zsk key-directory lifetime unlimited algorithm ecdsa256;
	};
	dnskey-ttl 300;
	publish-safety 300;
	retire-safety 300;
	purge-keys 1h;
	signatures-validity 12h;
	signatures-validity-dnskey 12h;
	signatures-refresh 2h;
	signatures-jitter 1h;
	max-zone-ttl 1d;
	nsec3param iterations 0 optout no salt-length 0;
};

dnssec-policy "repro-nsec3optout" {
	keys {
		ksk key-directory lifetime unlimited algorithm ecdsa256;
		zsk key-directory lifetime unlimited algorithm ecdsa256;
	};
	dnskey-ttl 300;
	publish-safety 300;
	retire-safety 300;
	purge-keys 1h;
	signatures-validity 12h;
	signatures-validity-dnskey 12h;
	signatures-refresh 2h;
	signatures-jitter 1h;
	max-zone-ttl 1d;
	nsec3param iterations 0 optout yes salt-length 0;
};

# Short-timer NSEC3 RSA length policies for key-policy gate
# (scenario-key-policy-gate.sh): same algorithm 8, 1024 → 2048 by policy name.
# Aggressive TTLs so an unlinked length change can withdraw the old ZSK before
# a large zone is fully re-signed (REPORT-KEY-POLICY.md).
dnssec-policy "repro-nsec3-rsa1024" {
	keys {
		ksk key-directory lifetime unlimited algorithm rsasha256 1024;
		zsk key-directory lifetime unlimited algorithm rsasha256 1024;
	};
	dnskey-ttl 5s;
	publish-safety 0;
	retire-safety 0;
	purge-keys 1h;
	signatures-validity 1h;
	signatures-validity-dnskey 1h;
	# Must be ≤ 90% of signatures-validity (BIND check).
	signatures-refresh 45m;
	signatures-jitter 0;
	zone-propagation-delay 1s;
	parent-propagation-delay 1s;
	max-zone-ttl 15s;
	nsec3param iterations 0 optout no salt-length 0;
};

dnssec-policy "repro-nsec3-rsa2048" {
	keys {
		ksk key-directory lifetime unlimited algorithm rsasha256 2048;
		zsk key-directory lifetime unlimited algorithm rsasha256 2048;
	};
	dnskey-ttl 5s;
	publish-safety 0;
	retire-safety 0;
	purge-keys 1h;
	signatures-validity 1h;
	signatures-validity-dnskey 1h;
	# Must be ≤ 90% of signatures-validity (BIND check).
	signatures-refresh 45m;
	signatures-jitter 0;
	zone-propagation-delay 1s;
	parent-propagation-delay 1s;
	max-zone-ttl 15s;
	nsec3param iterations 0 optout no salt-length 0;
};

options {
	directory "/var/cache/bind";
	listen-on port 53 { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	allow-update { none; };
	notify yes;
	transfer-format many-answers;
	dnssec-validation no;
	auth-nxdomain no;

	# Stretch signing so mid-sign AXFR/IXFR is more observable.
	sig-signing-nodes 25;
	sig-signing-signatures 25;
	sig-signing-type 65534;
};

zone "nsec.test.example." {
	type secondary;
	primaries { 172.30.55.10; };
	file "/var/lib/bind/db.nsec.test.example";
	key-directory "/etc/bind/keys";
	dnssec-policy "repro-nsec";
	inline-signing yes;
	allow-transfer { distribution-acl; localhost; any; };
	notify explicit;
	also-notify { 172.30.55.30; };
};

zone "nsec3.test.example." {
	type secondary;
	primaries { 172.30.55.10; };
	file "/var/lib/bind/db.nsec3.test.example";
	key-directory "/etc/bind/keys";
	dnssec-policy "repro-nsec3";
	inline-signing yes;
	allow-transfer { distribution-acl; localhost; any; };
	notify explicit;
	also-notify { 172.30.55.30; };
};

zone "nsec3optout.test.example." {
	type secondary;
	primaries { 172.30.55.10; };
	file "/var/lib/bind/db.nsec3optout.test.example";
	key-directory "/etc/bind/keys";
	dnssec-policy "repro-nsec3optout";
	inline-signing yes;
	allow-transfer { distribution-acl; localhost; any; };
	notify explicit;
	also-notify { 172.30.55.30; };
};
