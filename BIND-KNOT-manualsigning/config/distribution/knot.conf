# Knot secondary; dnssec-validation on — refuse to publish invalid IXFR/AXFR.
server:
  rundir: "/rundir"
  listen: 0.0.0.0@53
  user: knot:knot
  version: "bkms-distribution-validate-on"

log:
  - target: stdout
    any: info

database:
  storage: "/storage"

acl:
  - id: notify_from_primary
    address: [172.30.57.10]
    action: notify

  - id: transfer_any_lab
    address: [0.0.0.0/0]
    action: transfer

remote:
  - id: primary
    address: 172.30.57.10@53

template:
  - id: default
    storage: "/storage"
    dnssec-signing: off
    dnssec-validation: on
    journal-content: all
    zonefile-sync: -1
    master: primary
    acl: [notify_from_primary, transfer_any_lab]

zone:
  - domain: manual.test.example
