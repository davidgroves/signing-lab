include "/etc/bind/rndc.key";

controls {
	inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

acl "knot-acl" {
	172.30.57.30;
};

logging {
	channel default_log {
		file "/var/log/bind/named.log" versions 5 size 50m;
		severity info;
		print-time yes;
		print-severity yes;
		print-category yes;
	};
	channel xfer_log {
		file "/var/log/bind/xfer.log" versions 5 size 50m;
		severity info;
		print-time yes;
		print-severity yes;
		print-category yes;
	};
	category default { default_log; };
	category general { default_log; };
	category notify { default_log; };
	category xfer-out { xfer_log; };
};

options {
	directory "/var/cache/bind";
	listen-on port 53 { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	allow-update { none; };
	notify yes;
	transfer-format many-answers;
	dnssec-validation no;
	auth-nxdomain no;
	# After a zonefile edit + rndc reload, compute IXFR from the difference
	# (BIND does not re-sign; it only serves the hand-signed RRs).
	ixfr-from-differences yes;
};

# Static primary: zone produced offline by dnssec-signzone (NSEC3). No
# dnssec-policy / inline-signing — BIND does not maintain RRSIGs.
zone "manual.test.example." {
	type primary;
	file "/var/lib/bind/zones/db.manual.test.example.signed";
	allow-transfer { knot-acl; localhost; any; };
	also-notify { 172.30.57.30; };
	notify explicit;
};
