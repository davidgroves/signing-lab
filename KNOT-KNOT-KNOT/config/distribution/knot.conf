# Distribution secondary: pulls signed zone from Knot signer (no local signing).
server:
  rundir: "/rundir"
  listen: 0.0.0.0@53
  user: knot:knot
  version: "knot-distribution-lab"

log:
  - target: stdout
    any: info

database:
  storage: "/storage"

acl:
  - id: notify_from_signer
    address: [172.30.54.20]
    action: notify

  - id: transfer_any_lab
    address: [0.0.0.0/0]
    action: transfer

remote:
  - id: signer
    address: 172.30.54.20@53

template:
  - id: default
    storage: "/storage"
    dnssec-signing: off
    journal-content: all
    zonefile-sync: -1
    master: signer
    acl: [notify_from_signer, transfer_any_lab]

zone:
  - domain: nsec.test.example
  - domain: nsec3.test.example
  - domain: nsec3optout.test.example
