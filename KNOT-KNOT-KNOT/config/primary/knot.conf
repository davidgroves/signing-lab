# Unsigned hidden primary (Knot DNS 3.6+).
server:
  rundir: "/rundir"
  listen: 0.0.0.0@53
  user: knot:knot
  version: "knot-primary-lab"

log:
  - target: stdout
    any: info

database:
  storage: "/storage"

acl:
  - id: transfer_signer
    address: [172.30.54.20]
    action: transfer

  - id: notify_signer
    address: [172.30.54.20]
    action: notify

remote:
  - id: signer
    address: 172.30.54.20@53

template:
  - id: default
    storage: "/storage"
    # Zone files are generated on the host under KNOT/zones.
    file: "/zones/%s.zone"
    zonefile-load: whole
    journal-content: changes

zone:
  - domain: nsec.test.example
    file: "/zones/db.nsec.test.example"
    acl: [transfer_signer]
    notify: signer

  - domain: nsec3.test.example
    file: "/zones/db.nsec3.test.example"
    acl: [transfer_signer]
    notify: signer

  - domain: nsec3optout.test.example
    file: "/zones/db.nsec3optout.test.example"
    acl: [transfer_signer]
    notify: signer
