# BITW signer: secondary + on-secondary DNSSEC signing (Knot DNS 3.6+).
server:
  rundir: "/rundir"
  listen: 0.0.0.0@53
  user: knot:knot
  version: "knot-signer-lab"
  # Keep signing parallel-friendly for large zones without publishing mid-sign.
  tcp-workers: 4
  udp-workers: 4

log:
  - target: stdout
    any: info

database:
  storage: "/storage"
  kasp-db: "/storage/kaspdb"

policy:
  - id: repro-nsec
    algorithm: ecdsap256sha256
    nsec3: off
    rrsig-lifetime: 12h
    rrsig-refresh: 2h
    dnskey-ttl: 300s
    zone-max-ttl: 1d
    zsk-lifetime: 0
    ksk-lifetime: 0

  - id: repro-nsec3
    algorithm: ecdsap256sha256
    nsec3: on
    nsec3-iterations: 0
    nsec3-opt-out: off
    nsec3-salt-length: 0
    rrsig-lifetime: 12h
    rrsig-refresh: 2h
    dnskey-ttl: 300s
    zone-max-ttl: 1d
    zsk-lifetime: 0
    ksk-lifetime: 0

  - id: repro-nsec3optout
    algorithm: ecdsap256sha256
    nsec3: on
    nsec3-iterations: 0
    nsec3-opt-out: on
    nsec3-salt-length: 0
    rrsig-lifetime: 12h
    rrsig-refresh: 2h
    dnskey-ttl: 300s
    zone-max-ttl: 1d
    zsk-lifetime: 0
    ksk-lifetime: 0

acl:
  - id: transfer_distribution
    address: [172.30.54.30]
    action: transfer

  - id: notify_from_primary
    address: [172.30.54.10]
    action: notify

  - id: transfer_any_lab
    address: [0.0.0.0/0]
    action: transfer

remote:
  - id: primary
    address: 172.30.54.10@53

  - id: distribution
    address: 172.30.54.30@53

template:
  - id: default
    storage: "/storage"
    # Sign after every inbound AXFR/IXFR; publish only when commit succeeds.
    dnssec-signing: on
    journal-content: all
    zonefile-sync: -1
    acl: [notify_from_primary, transfer_distribution, transfer_any_lab]
    notify: distribution
    master: primary

zone:
  - domain: nsec.test.example
    dnssec-policy: repro-nsec

  - domain: nsec3.test.example
    dnssec-policy: repro-nsec3

  - domain: nsec3optout.test.example
    dnssec-policy: repro-nsec3optout
