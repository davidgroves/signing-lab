name: knot-resign-repro

x-knot-common: &knot-common
  image: cznic/knot:${KNOT_TAG:-latest}
  # Latest Hub tag tracks current Knot release (verified 3.6.1).
  command: ["knotd", "-c", "/config/knot.conf", "-v"]
  environment:
    - TZ=UTC
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "knotc status >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  primary:
    <<: *knot-common
    container_name: knot-primary
    hostname: primary
    networks:
      dnsnet:
        ipv4_address: 172.30.54.10
    ports:
      - "${PRIMARY_PORT:-25353}:53/udp"
      - "${PRIMARY_PORT:-25353}:53/tcp"
    volumes:
      - ./config/primary/knot.conf:/config/knot.conf:ro
      - ./zones:/zones:ro
      - ./storage/primary:/storage
      - ./rundir/primary:/rundir

  signer:
    <<: *knot-common
    container_name: knot-signer
    hostname: signer
    depends_on:
      primary:
        condition: service_healthy
    networks:
      dnsnet:
        ipv4_address: 172.30.54.20
    ports:
      - "${SIGNER_PORT:-25354}:53/udp"
      - "${SIGNER_PORT:-25354}:53/tcp"
    volumes:
      - ./config/signer/knot.conf:/config/knot.conf:ro
      - ./storage/signer:/storage
      - ./rundir/signer:/rundir

  distribution:
    <<: *knot-common
    container_name: knot-distribution
    hostname: distribution
    depends_on:
      signer:
        condition: service_healthy
    networks:
      dnsnet:
        ipv4_address: 172.30.54.30
    ports:
      - "${DISTRIBUTION_PORT:-25355}:53/udp"
      - "${DISTRIBUTION_PORT:-25355}:53/tcp"
    volumes:
      - ./config/distribution/knot.conf:/config/knot.conf:ro
      - ./storage/distribution:/storage
      - ./rundir/distribution:/rundir

networks:
  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.54.0/24
